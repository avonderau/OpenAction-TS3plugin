[package]
name = "ts3deck"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "TeamSpeak 3 keys for OpenLinkHub Nexus Decks, OpenDeck and Stream Deck"
repository = "https://github.com/avonderau/openaction-ts3plugin"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
