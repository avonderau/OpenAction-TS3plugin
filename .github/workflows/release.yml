name: Build and publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Select and validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$REF_NAME"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Check Cargo and manifest versions
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          manifest_version=$(jq -r '.Version' com.avonderau.ts3deck.sdPlugin/manifest.json)
          if [[ "$cargo_version" != "$version" || "$manifest_version" != "$version.0" ]]; then
            echo "Version mismatch: tag=$version Cargo.toml=$cargo_version manifest=$manifest_version" >&2
            exit 1
          fi

      - name: Run tests
        run: cargo test --locked

      - name: Build installable plugin
        run: |
          sh scripts/pack.sh
          test -s dist/com.avonderau.ts3deck.streamDeckPlugin
          unzip -t dist/com.avonderau.ts3deck.streamDeckPlugin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/com.avonderau.ts3deck.streamDeckPlugin \
            --title "TeamSpeak 3 for Deck $RELEASE_TAG" \
            --generate-notes \
            --verify-tag 2>/dev/null || {
              if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
                exit 1
              fi
              gh release create "$RELEASE_TAG" \
                dist/com.avonderau.ts3deck.streamDeckPlugin \
                --target "$GITHUB_SHA" \
                --title "TeamSpeak 3 for Deck $RELEASE_TAG" \
                --generate-notes
            }
