name: Build and publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Select and validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$REF_NAME"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check package and manifest versions
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('com.avonderau.ts3deck.sdPlugin/manifest.json', 'utf8'));
          const version = process.env.RELEASE_TAG.slice(1);
          if (pkg.version !== version || manifest.Version !== version + '.0') {
            console.error('Version mismatch:', {tag: version, package: pkg.version, manifest: manifest.Version});
            process.exit(1);
          }
          NODE

      - name: Run tests
        run: npm test

      - name: Build installable plugin
        run: |
          npm run pack
          test -s dist/com.avonderau.ts3deck.streamDeckPlugin
          unzip -t dist/com.avonderau.ts3deck.streamDeckPlugin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/com.avonderau.ts3deck.streamDeckPlugin \
            --title "TeamSpeak 3 for Deck $RELEASE_TAG" \
            --generate-notes \
            --verify-tag 2>/dev/null || {
              if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
                exit 1
              fi
              gh release create "$RELEASE_TAG" \
                dist/com.avonderau.ts3deck.streamDeckPlugin \
                --target "$GITHUB_SHA" \
                --title "TeamSpeak 3 for Deck $RELEASE_TAG" \
                --generate-notes
            }
