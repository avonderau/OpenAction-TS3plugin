name: Build

# Tests and builds the plugin on Linux, macOS and Windows, then packs all
# three platforms' binaries into one .streamDeckPlugin archive. Called by the
# CI and release workflows.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - os: macos-latest
            platform: macos
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-latest
            platform: windows
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add ${{ matrix.targets }}

      - name: Check formatting
        if: matrix.platform == 'linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: sh scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: com.avonderau.ts3deck.sdPlugin/bin/
          if-no-files-found: error

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: com.avonderau.ts3deck.sdPlugin/bin/
          merge-multiple: true

      - name: Pack plugin
        run: |
          REQUIRE_ALL=1 sh scripts/pack.sh
          unzip -l dist/com.avonderau.ts3deck.streamDeckPlugin | grep bin/

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/com.avonderau.ts3deck.streamDeckPlugin
          if-no-files-found: error
